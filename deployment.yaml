apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx-app
  labels:
    app: my-nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-nginx-app
  template:
    metadata:
      labels:
        app: my-nginx-app
    spec:
      containers:
      - name: nginx-container
        image: nginx:alpine  # Pre-built Nginx image from Docker Hub
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
          - |
            nginx &
            sleep 120
            echo "Shutting down after 2 minutes"
            nginx -s quit
